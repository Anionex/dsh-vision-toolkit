# TEMPORARY. pnpm 11 enables its 24-hour release quarantine (minimumReleaseAge)
# in CI, and the whole DSH 0.1.5-rc.1 family was published hours ago, so the
# frozen-lockfile verification rejects every one of these exact versions with
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION. Only the exact pinned versions this
# lockfile installs are exempted; the policy stays fully in force for every
# other package, including future 0.1.5 releases. Delete this block once these
# versions age past the quarantine.
