name: Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - examples/ui-restoration/assets/initial.png
      - examples/ui-restoration/assets/implementation.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p _site/assets _site/examples/ui-restoration/assets
          cp index.html _site/index.html
          cp assets/hero.png assets/social-preview.png assets/vision-settings.png _site/assets/
          cp examples/ui-restoration/assets/initial.png _site/examples/ui-restoration/assets/initial.png
          cp examples/ui-restoration/assets/implementation.png _site/examples/ui-restoration/assets/implementation.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
